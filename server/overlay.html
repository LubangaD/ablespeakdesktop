<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbleSpeak Overlay</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  /* ── Reduced Motion — respect user preference ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Container ── */
  .overlay-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    height: 100%;
    padding: 8px;
  }

  /* ── Floating Pill ── */
  .pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: rgba(18, 18, 24, 0.92);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 10px 18px 12px;
    min-width: 200px;
    max-width: 420px;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: bottom center;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .pill.hiding {
    animation: slideDown 0.2s cubic-bezier(0.4, 0, 1, 1) forwards;
  }

  @keyframes slideDown {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(12px) scale(0.96); }
  }

  /* ── Shortcut Hint ── */
  .shortcut-hint {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #a78bfa 0%, #6ee7b7 50%, #93c5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0.9;
  }

  .shortcut-hint kbd {
    font-family: inherit;
    font-weight: 700;
    -webkit-text-fill-color: transparent;
  }

  /* ── Transcript / Status Area ── */
  .transcript-area {
    width: 100%;
    min-height: 0;
    max-height: 96px;
    overflow-y: auto;
    text-align: center;
    transition: all 0.2s ease;
  }

  .transcript-area:empty {
    display: none;
  }

  .transcript-text {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .transcript-text.response {
    color: rgba(167, 139, 250, 0.95);
  }

  .transcript-text.error {
    color: rgba(248, 113, 113, 0.9);
    font-size: 12px;
  }

  /* HFI-2: distinct from .error — nothing broke, the mic just didn't catch it */
  .transcript-text.not-heard {
    color: rgba(251, 191, 36, 0.9);
    font-size: 12px;
  }

  .transcript-text.listening-label {
    color: rgba(110, 231, 183, 0.9);
    font-size: 12px;
    animation: textPulse 1.5s ease-in-out infinite;
  }

  .transcript-text.interim {
    color: rgba(255, 255, 255, 0.5);
    font-style: italic;
  }

  @keyframes textPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ── Last command: what was heard and how it ended (always on screen) ── */
  .last-command {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
  }

  .last-command[hidden] {
    display: none;
  }

  .last-heard {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .last-outcome {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  .last-outcome[data-state="working"] { color: #c4b5fd; }
  .last-outcome[data-state="done"] { color: #6ee7b7; }
  .last-outcome[data-state="failed"] { color: #fca5a5; }
  .last-outcome[data-state="waiting"] { color: #fcd34d; }
  .last-outcome[data-state="ignored"] { color: rgba(255, 255, 255, 0.6); font-weight: 400; }

  /* ── Whose session this is ── */
  .who {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
  }

  .who[hidden] {
    display: none;
  }

  /* ── Button Row ── */
  .btn-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.7);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    transform: scale(1.08);
  }

  .btn:focus-visible {
    outline: 3px solid #6ee7b7;
    outline-offset: 2px;
  }

  .btn:active {
    transform: scale(0.95);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── Mic Button (special) ── */
  .btn-mic {
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.08);
  }

  .btn-mic.listening {
    background: rgba(110, 231, 183, 0.2);
    color: #6ee7b7;
    box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.4);
    animation: micPulse 1.5s ease-in-out infinite;
  }

  @keyframes micPulse {
    0%   { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.35); }
    70%  { box-shadow: 0 0 0 12px rgba(110, 231, 183, 0); }
    100% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0); }
  }

  .btn-mic.processing {
    background: rgba(167, 139, 250, 0.2);
    color: #a78bfa;
    animation: none;
  }

  .btn-mic.dictating {
    background: rgba(251, 191, 36, 0.25);
    color: #fbbf24;
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
    animation: dictPulse 1s ease-in-out infinite;
  }

  @keyframes dictPulse {
    0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.35); }
    70%  { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
    100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
  }

  /* ── Speaking state — mic becomes a red stop button ── */
  .btn-mic.speaking {
    background: rgba(248, 113, 113, 0.22);
    color: #f87171;
    box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4);
    animation: speakPulse 1.2s ease-in-out infinite;
  }

  @keyframes speakPulse {
    0%   { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.35); }
    70%  { box-shadow: 0 0 0 12px rgba(248, 113, 113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
  }

  /* ── Continuous-listening toggle ── */
  .btn.loop-on {
    background: rgba(110, 231, 183, 0.18);
    color: #6ee7b7;
  }

  .btn-mic svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>
<div class="overlay-root" role="application" aria-label="AbleSpeak Voice Overlay">
  <div class="pill" id="pill">
    <!-- Shortcut hint -->
    <div class="shortcut-hint" aria-hidden="true">
      Dictate <kbd>Ctrl + Shift + A</kbd>
    </div>

    <!-- Whose progress this computer is recording -->
    <div class="who" id="whoLabel" hidden></div>

    <!-- Last command: what was heard, and whether it worked -->
    <div class="last-command" id="lastCommand" hidden>
      <div class="last-heard" id="lastHeard"></div>
      <div class="last-outcome" id="lastOutcome" role="status" aria-live="polite"></div>
    </div>

    <!-- Transcript / status text (screen reader announces changes) -->
    <div class="transcript-area" id="transcriptArea" aria-live="assertive" aria-atomic="true" role="status">
      <div class="transcript-text" id="transcriptText"></div>
    </div>

    <!-- Button row -->
    <div class="btn-row" role="toolbar" aria-label="Voice controls">
      <button class="btn btn-mic" id="btnMic"
              role="switch"
              aria-label="Microphone — click to start listening"
              aria-pressed="false"
              title="Click to speak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="btn" id="btnLoop"
              role="switch"
              aria-label="Continuous listening mode"
              aria-pressed="false"
              title="Continuous listening OFF — one command per activation (click to turn on)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="btn" id="btnDashboard"
              aria-label="Open AbleSpeak Dashboard"
              title="Open Dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// Compatibility shim: provides no-op stubs when running outside Electron
// so overlay.html works as a plain browser page served from the Node server.
if (!window.electronAPI) {
  window.electronAPI = {
    speak: null,
    stopTTS: null,
    captureScreen: null,
    showDashboard: () => window.open('http://localhost:3001', '_blank'),
    hideOverlay: () => {},
    showOverlay: () => {},
    onToggleListen: () => {},
    onShown: () => {},
    onStop: () => {},
    onResponse: () => {},
    onError: () => {},
    onTTSState: () => {},
    onConfig: () => {},
    onShortcut: () => {},
  };
}

(() => {
  'use strict';

  // ── DOM refs ──
  const pill = document.getElementById('pill');
  const btnMic = document.getElementById('btnMic');
  const btnLoop = document.getElementById('btnLoop');
  const btnDashboard = document.getElementById('btnDashboard');
  const transcriptArea = document.getElementById('transcriptArea');
  const transcriptText = document.getElementById('transcriptText');

  // ── State ──
  let state = 'idle'; // idle | listening | processing
  let hasGreeted = false;
  // Continuous mode = auto-restart the mic after each command (hands-free).
  // ON by default for accessibility: hands-free users need the mic to
  // keep listening. Users can toggle it off if ambient noise is an issue.
  let continuousMode = (localStorage.getItem('ablespeak_continuous') !== '0');
  let consecutiveErrors = 0; // Track repeated failures for backoff delay
  const MAX_CONSECUTIVE_ERRORS = 10; // Very forgiving — don't kill the mic

  // ── Recording state ──
  let mediaRecorder = null;  // The recording in progress, if any
  let stream = null;
  let audioCtx = null;     // Reused across turns — see openMic (Fix #7)
  let audioSource = null;  // Latest MediaStreamSource node, disconnected between turns
  let analyser = null;     // Level meter on the open mic stream
  let micStarting = false; // startListening() is waiting for the mic
  // Levels and pauses follow the student's profile (listening_settings).
  let SILENCE_THRESHOLD = 15;
  let SPEECH_THRESHOLD = 45;  // Higher = less likely to trigger on music
  let SILENCE_DURATION = 1500; // 1.5s silence after speech = done talking
  const MIN_RECORD_MS = 600;     // Minimum 600ms recording before silence check
  const MAX_RECORD_MS = 8000;    // 8s max for a command — shorter to limit music bleed
  const COOLDOWN_MS = 500;       // 500ms between recordings
  let lastRecordEnd = 0;         // When the last recording stopped

  // Dictation keeps listening while earlier speech is typed. Each pause ends a
  // phrase, which is sent to be typed while the next phrase is already being
  // recorded, so nothing said during typing is lost. The server types phrases
  // in the order they were spoken.
  let DICTATION_SILENCE_MS = 1800;       // quiet this long ends a phrase
  const DICTATION_SPEECH_GAP_MS = 4000;  // or this long without speech, in a noisy room
  const DICTATION_MAX_RECORD_MS = 30000; // longer phrases are split, not dropped
  let dictationClipsPending = 0;         // phrases sent but not yet typed

  // HFI-2 "didn't catch that" is only for a real attempt at speaking (half a
  // second of quiet, voice-level sound), and at most once every 30 seconds, so
  // room noise can't make AbleSpeak talk over the student again and again.
  let QUIET_SPEECH_THRESHOLD = 30;
  const QUIET_SPEECH_MIN_MS = 500;
  const NOT_HEARD_INTERVAL_MS = 30000;
  let lastNotHeardAt = 0;
  let ttsActive = false;         // True while TTS audio is playing (mutes the mic — Gap 3)
  const TTS_COOLDOWN_MS = 2500;  // Wait after TTS finishes before re-opening the mic
  let ttsWatchdog = null;        // Failsafe: force-clears ttsActive if 'done' is ever lost
  const TTS_MAX_MS = 10000;      // Max plausible TTS duration — shorter to prevent mic deadlock

  // SVG icons — swapped on the mic button depending on state
  const MIC_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
  const STOP_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/></svg>`;
  let sleeping = false;          // True while in sleep mode (Gap 5)
  let dictationMode = false;     // True while in dictation mode (typing speech directly)

  // ── TTS (via Electron main process → PowerShell SAPI) ──
  // Browser speechSynthesis fails silently in transparent Electron windows.
  // Route through the main process instead.

  function speak(text) {
    if (!text) return null;

    // Use Electron IPC → Edge neural TTS (SAPI fallback in main process).
    // Returns null: the mic restart is driven by the real 'tts-state' 'done'
    // event from the main process, not an estimated timer. We mark ttsActive
    // synchronously so nothing re-opens the mic before the 'speaking' event lands.
    if (window.electronAPI && window.electronAPI.speak) {
      console.log(`[TTS] Speaking via Electron TTS: "${text.slice(0, 50)}..."`);
      ttsActive = true;
      // Failsafe: if the main process never sends 'tts-state' 'done' (e.g. the
      // window is destroyed mid-speech), force-clear so the mic can't deadlock.
      if (ttsWatchdog) clearTimeout(ttsWatchdog);
      ttsWatchdog = setTimeout(() => {
        console.warn('[TTS] Watchdog fired — no done event; re-enabling mic');
        ttsActive = false;
        if (active && state !== 'listening') { setIdleUI(); startListening(); }
      }, TTS_MAX_MS);
      window.electronAPI.speak(text);
      return null;
    }

    // Fallback: browser speechSynthesis
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.1;
      u.pitch = 1.0;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
      return u;
    }

    console.warn('[TTS] No TTS engine available');
    return null;
  }

  // ── UI helpers ──
  function setTranscript(text, className) {
    transcriptText.textContent = text;
    transcriptText.className = 'transcript-text' + (className ? ' ' + className : '');
    transcriptArea.style.display = text ? 'block' : 'none';
  }

  // ── Last command: heard → working → done / failed (Stage 0) ──
  // Stays on screen until the next command is heard, so the student can
  // always see what AbleSpeak took them to say and whether it worked.
  const lastCommand = document.getElementById('lastCommand');
  const lastHeard = document.getElementById('lastHeard');
  const lastOutcome = document.getElementById('lastOutcome');
  const whoLabel = document.getElementById('whoLabel');
  let turnOpen = false; // a command was heard and has not finished yet
  let taskRunning = false; // a multi-step task is in progress (Stage 3)

  function showOutcome(kind, text) {
    lastOutcome.dataset.state = kind;
    lastOutcome.textContent = text;
    lastCommand.hidden = false;
  }

  function showHeard(text) {
    lastHeard.textContent = `Heard: “${text}”`;
    lastHeard.title = text;
    turnOpen = true;
    showOutcome('working', 'Working…');
  }

  // End the current command. Nothing to report if nothing was heard.
  function finishTurn(kind, text) {
    if (!turnOpen) return;
    turnOpen = false;
    showOutcome(kind, text);
  }

  // How to listen for the student now at the computer: a quiet speaker
  // needs lower levels, a slow speaker a longer pause (Stage 1).
  function applyListeningSettings(settings) {
    if (!settings || typeof settings.speechThreshold !== 'number') return;
    SPEECH_THRESHOLD = settings.speechThreshold;
    SILENCE_THRESHOLD = settings.silenceThreshold;
    QUIET_SPEECH_THRESHOLD = settings.quietThreshold;
    SILENCE_DURATION = settings.commandPauseMs;
    DICTATION_SILENCE_MS = settings.dictationPauseMs;
    console.log(`[Overlay] Listening: ${settings.sensitivity}, pause ${settings.commandPauseMs} ms`);
  }

  function handleTaskProgress(event) {
    const kind = event.phase;
    if (kind === 'plan') {
      taskRunning = true;
      turnOpen = true;
      const asks = event.asksFirst?.length
        ? ` — I'll ask before step ${event.asksFirst.map(a => a.index + 1).join(' and ')}`
        : '';
      showOutcome('working', `Plan: ${event.steps.length} step${event.steps.length === 1 ? '' : 's'}${asks}`);
      // Listen during the task, so "stop" works.
      clearWatchdog();
      if (state === 'processing') resumeListening(200);
    } else if (kind === 'resume') {
      taskRunning = true;
      clearWatchdog();
      if (state === 'processing') resumeListening(200);
    } else if (kind === 'step') {
      showOutcome('working', `Step ${event.index + 1} of ${event.total}: ${event.step.do}`);
    } else if (kind === 'check' && !event.ok) {
      showOutcome('working', `Step ${event.index + 1} didn't work — trying another way…`);
    } else if (kind === 'replan') {
      showOutcome('working', `New plan (${event.attempt} of 2): ${event.steps.length} step${event.steps.length === 1 ? '' : 's'}`);
    } else if (['done', 'failed', 'stopped', 'cannot'].includes(kind)) {
      taskRunning = false;
    }
  }

  function showStudent(student) {
    whoLabel.textContent = student ? `${student.name}'s session` : '';
    whoLabel.hidden = !student;
  }

  // What to say out loud when something failed: the server's own sentence
  // when it wrote one for the student, otherwise a plain apology.
  // Tool results sometimes end with advice for the AI ("Use uia_query to…");
  // the student never needs to see or hear that.
  const forStudent = text => String(text || '').replace(/\s*Use [a-z]+_[a-z_]+ to [^.]*\.?/g, '').trim();

  function spokenFailure(text) {
    const said = forStudent(text);
    if (!said || /^error:/i.test(said) || said.length > 160) return "Sorry, that didn't work. Please try again.";
    return said;
  }

  function setListeningUI() {
    state = 'listening';
    btnMic.title = 'Listening... click to stop';
    btnMic.setAttribute('aria-label', 'Microphone — currently listening, click to stop');
    btnMic.setAttribute('aria-pressed', 'true');
    // While asleep we keep the mic on (to hear "wake up") but show a sleep cue.
    if (sleeping) {
      btnMic.className = 'btn btn-mic listening';
      btnMic.style.opacity = '0.5';
      setTranscript('💤 Sleeping — say "wake up"', 'listening-label');
    } else if (dictationMode) {
      btnMic.className = 'btn btn-mic dictating';
      btnMic.style.opacity = '';
      setTranscript(dictationClipsPending > 0 ? '✏️ Typing… keep talking' : '✏️ Dictating...', 'listening-label');
    } else {
      btnMic.className = 'btn btn-mic listening';
      btnMic.style.opacity = '';
      setTranscript('Listening...', 'listening-label');
    }
  }

  function setProcessingUI() {
    state = 'processing';
    btnMic.className = 'btn btn-mic processing';
    btnMic.title = 'Processing...';
    btnMic.setAttribute('aria-label', 'Microphone — processing your command');
    btnMic.setAttribute('aria-pressed', 'false');
    startWatchdog();
  }

  function setIdleUI() {
    state = 'idle';
    btnMic.className = 'btn btn-mic';
    btnMic.title = 'Click to speak';
    btnMic.setAttribute('aria-label', 'Microphone — click to start listening');
    btnMic.setAttribute('aria-pressed', 'false');
    clearWatchdog();
  }

  // HFI-2: distinct from plain idle — tells the student AbleSpeak noticed
  // *something* but it wasn't loud enough to make out, instead of the total
  // silence they'd otherwise get with no way to tell "not heard" from "nothing
  // happened". Speaking it matters as much as showing it: the overlay is easy
  // to not be looking at, and this is the one state where knowing matters most.
  function setNotHeardUI() {
    setIdleUI();
    setTranscript("Didn't catch that — try again a little louder", 'not-heard');
    speak("I didn't catch that. Try again a little louder."); // 'done' event re-opens the mic
  }

  // Re-open the mic once the server has answered. In dictation the mic may
  // already be recording the next phrase, so leave a running recording alone.
  function resumeListening(delay) {
    setTimeout(() => {
      if (state === 'listening') return;
      setIdleUI();
      if (active) startListening();
    }, delay);
  }

  function dictationClipAnswered() {
    if (dictationClipsPending > 0) dictationClipsPending--;
  }

  // ── Processing Watchdog ──
  // In command mode: wait 60s (page summaries take time) then just show a hint.
  // In dictation mode: 8s is more than enough (transcribe + COM type). If the
  // server dropped the packet, restart the mic so the user isn't locked out.
  const PROCESSING_TIMEOUT_MS = 60000;
  const DICTATION_TIMEOUT_MS = 8000;
  let watchdogTimer = null;

  function startWatchdog() {
    clearWatchdog();
    const delay = dictationMode ? DICTATION_TIMEOUT_MS : PROCESSING_TIMEOUT_MS;
    watchdogTimer = setTimeout(() => {
      console.warn('[Overlay] Watchdog fired after', delay, 'ms — resetting mic');
      setIdleUI();
      setTranscript(dictationMode ? '✏️ Dictating...' : 'Ready', 'listening-label');
      if (active) startListening();
    }, delay);
  }

  function clearWatchdog() {
    if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
  }

  function feedWatchdog() {
    // Evidence of progress (e.g. transcription arrived) — restart the timer
    if (state === 'processing') startWatchdog();
  }

  // ════════════════════════════════════════════════
  // ── WebSocket Connection (same pipeline as dashboard) ──
  // ════════════════════════════════════════════════

  let ws = null;
  let wsConnected = false;
  // EXT-2: the gateway requires a token by default now. The overlay is the
  // student's ONLY interface — it must never be the thing a token
  // requirement quietly breaks. Bootstrap-fetch it once (same pattern as the
  // Chrome extension) and cache across reloads; loopback-only server-side.
  let cachedWsToken = localStorage.getItem('ablespeak_ws_token') || '';

  async function connectWS() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    if (!cachedWsToken) {
      try {
        const res = await fetch('http://localhost:3001/api/ws-token');
        if (res.ok) {
          const body = await res.json();
          if (body.token) {
            cachedWsToken = body.token;
            localStorage.setItem('ablespeak_ws_token', cachedWsToken);
          }
        }
      } catch (err) {
        // Gateway may not be up yet — the 2s reconnect loop below tries again.
        console.warn('[Overlay] Could not fetch WS token yet:', err.message);
      }
      // Another call may have connected while we were awaiting the fetch.
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    }

    const tokenQS = cachedWsToken ? ('?token=' + encodeURIComponent(cachedWsToken)) : '';
    ws = new WebSocket('ws://localhost:3001/ws/dashboard' + tokenQS);

    ws.onopen = () => {
      wsConnected = true;
      console.log('[Overlay] WebSocket connected — using fast dashboard pipeline');
      // On reconnect after server restart: if active but mic isn't running, restart it.
      // Covers the case where state was reset to idle by ws.onclose above.
      if (active && state === 'idle') {
        setTimeout(() => { if (active && state === 'idle') startListening(); }, 600);
      }
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        handleWSMessage(data);
      } catch {}
    };

    ws.onclose = () => {
      wsConnected = false;
      // If we were processing a command when the server went down, unblock the mic.
      // Without this, state stays 'processing' forever and startListening() never runs.
      if (state === 'processing') {
        setIdleUI();
        setTranscript(dictationMode ? '✏️ Reconnecting...' : 'Reconnecting...', 'listening-label');
      }
      dictationClipsPending = 0; // answers to earlier phrases may never arrive
      taskRunning = false;       // a task does not survive the connection
      clearWatchdog();
      setTimeout(connectWS, 2000);
    };

    ws.onerror = () => {
      wsConnected = false;
    };
  }

  function handleWSMessage(data) {
    // Voice transcription received — show what was heard
    if (data.type === 'voice_transcription') {
      setTranscript(data.text || '', 'listening-label');
      if (data.text) showHeard(data.text);
      feedWatchdog();
      return;
    }

    // Who this computer is recording for — on connect, and when a teacher
    // changes it on the Teacher page.
    if (data.type === 'initial_status') {
      showStudent(data.activeStudent || null);
      applyListeningSettings(data.listening);
      return;
    }
    if (data.type === 'listening_settings') {
      applyListeningSettings(data);
      return;
    }

    // A multi-step task: show each step, and keep listening so the student
    // can say "stop" at any point.
    if (data.type === 'agent_progress') {
      handleTaskProgress(data);
      return;
    }
    if (data.type === 'active_student') {
      showStudent(data.student || null);
      return;
    }

    // No speech detected. This is TERMINAL for the current turn: the server
    // found nothing actionable (silence, noise, or a filtered transcript), and
    // it sends exactly one terminal message per command. If we're 'processing',
    // this IS the answer — so always recover, otherwise the mic sticks in
    // 'processing' until the 60s watchdog. (This was the stuck-overlay bug.)
    if (data.type === 'voice_no_speech') {
      dictationClipAnswered();
      finishTurn('ignored', 'Ignored — it sounded like background talk');
      clearWatchdog();
      if (state === 'listening') return; // already recording the next phrase
      setIdleUI();
      if (!dictationMode) setTranscript('Ready', 'listening-label');
      resumeListening(300);
      return;
    }

    // Voice error — also terminal for this turn. Recover even while processing.
    if (data.type === 'voice_error') {
      dictationClipAnswered();
      turnOpen = true; // nothing was heard, but the attempt still failed
      finishTurn('failed', "✗ Couldn't understand that — please say it again");
      clearWatchdog();
      consecutiveErrors++;
      setTranscript(data.error || 'Voice error', 'error');
      // Always restart — use increasing backoff delay instead of killing the mic
      const backoff = Math.min(consecutiveErrors * 500, 3000);
      resumeListening(backoff);
      return;
    }

    // Voice busy while recording: in dictation the server's queue is full and
    // this phrase was dropped. Say so, because the student can't see the gap.
    if (data.type === 'voice_busy' && state === 'listening') {
      dictationClipAnswered();
      if (data.task) {
        setTranscript('Still working — say "stop" to cancel', 'listening-label');
      } else if (!dictationMode) {
        setTranscript('Still working on the last command…', 'listening-label');
      } else {
        setTranscript("⚠️ I missed the last part — please say it again", 'error');
        turnOpen = true;
        finishTurn('failed', '✗ Missed the last part — say it again');
        speak('I missed the last part. Please say it again.');
      }
      return;
    }

    // Voice busy — server is still on the previous command.
    // Stay in processing state with mic OFF — don't restart listening.
    // A task is running: the server only listens for "stop". Keep the mic on.
    if (data.type === 'voice_busy' && data.task) {
      setTranscript('Still working — say "stop" to cancel', 'listening-label');
      resumeListening(200);
      return;
    }

    if (data.type === 'voice_busy') {
      setTranscript('Still working… mic paused', '');
      showOutcome('working', 'Still working on the last command…');
      if (state !== 'processing') setProcessingUI();
      feedWatchdog(); // Extend the watchdog since we know the server is alive
      return;
    }

    // Command complete (voice or chat) — this is the actual AI response
    if (data.type === 'command_complete') {
      handleResponse(data);
      return;
    }

    // Chat assistant message (alternative response type)
    if (data.type === 'chat_assistant_message') {
      handleResponse(data);
      return;
    }
  }

  function handleResponse(data) {
    dictationClipAnswered();
    // A finished task, or one paused on a question, is no longer running.
    if (data.task || data.model === 'confirmation-prompt') taskRunning = false;
    clearWatchdog();

    // In always-listening mode, never deactivate
    // (active stays true so mic restarts after command)

    if (data.error) {
      consecutiveErrors++;
      const failure = forStudent(data.text || (typeof data.error === 'string' ? data.error : '') || 'Error');
      setTranscript('Try again, or say it a different way.', 'error');
      turnOpen = true;
      finishTurn('failed', `✗ Didn't work: ${failure.replace(/^That didn't work:\s*/i, '')}`);
      // A failure is never silent: the student may not be looking (CVA-3).
      // The Electron voice re-opens the mic when it finishes speaking.
      const utterance = speak(spokenFailure(failure));
      if (utterance) {
        utterance.onend = () => resumeListening(200);
      } else if (!ttsActive) {
        // Always restart — use increasing backoff delay instead of killing the mic
        resumeListening(Math.min(consecutiveErrors * 500, 3000));
      }
      return;
    }

    consecutiveErrors = 0;
    if (data.model === 'confirmation-prompt') finishTurn('waiting', 'Waiting — say yes or no');
    else if (data.task?.status === 'stopped') finishTurn('done', 'Stopped');
    else if (data.task) finishTurn('done', `✓ Done — ${data.task.steps} step${data.task.steps === 1 ? '' : 's'}`);
    else finishTurn('done', '✓ Done');

    // Determine if silent (action commands like scroll)
    const isSilent = data.silent === true ||
      (data.toolCalls && Array.isArray(data.toolCalls) && !data.text?.trim());

    if (isSilent) {
      setTranscript('✓', 'response');
      // Immediately restart listening
      resumeListening(100);
      return;
    }

    // Normal response with text
    const responseText = (typeof data.result === 'string' ? data.result : data.result?.text) || data.text || '';
    if (responseText && responseText !== 'Done') {
      setTranscript(responseText, 'response');
      const utterance = speak(responseText);
      if (utterance) {
        // Browser speechSynthesis path — restart when the utterance ends.
        utterance.onend = () => resumeListening(200);
        // Safety fallback: if TTS hangs, force restart after 8s
        setTimeout(() => {
          if (state !== 'listening' && active && !ttsActive) {
            setIdleUI();
            startListening();
          }
        }, 8000);
      } else if (ttsActive) {
        // Electron TTS path — the mic restart is driven by the 'tts-state' 'done'
        // event. Safety fallback only, in case that event never arrives.
        setTimeout(() => {
          if (state !== 'listening' && active && !ttsActive) {
            setIdleUI();
            startListening();
          }
        }, 12000);
      } else {
        // No TTS engine available — restart immediately
        resumeListening(300);
      }
    } else {
      // Empty response — restart immediately
      resumeListening(100);
    }
  }

  // Connect immediately
  connectWS();

  // ════════════════════════════════════════════════
  // ── Voice Recording (MediaRecorder + Gemini transcription) ──
  // ════════════════════════════════════════════════

  // Open the microphone, or keep the one already open (dictation records
  // phrase after phrase on the same stream, so no speech is lost in between).
  async function openMic() {
    if (stream && stream.active && analyser) return;
    releaseMic();
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,  // Boost voice, suppress background
        sampleRate: 16000,
      }
    });
    stream = newStream;

    // Record directly from the raw mic stream — matches the dashboard
    // Chat page's proven-working capture path. (An earlier attempt routed
    // recording through a highpass/compressor/MediaStreamDestination graph
    // for noise filtering; that's removed because it could leave
    // startListening() hung or throwing before the recorder ever started,
    // which is worse than no filtering at all.)
    //
    // Reuse a single AudioContext across turns instead of creating a new
    // one every call (Fix #7, borrowed from the dashboard's Chat page) —
    // Chrome caps concurrent/recently-created AudioContexts, and an
    // always-listening loop that creates+closes one every turn can exhaust
    // that cap after only a handful of commands even though each one is
    // individually closed, since close() isn't guaranteed to fully release
    // the underlying hardware context before the next create.
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    audioSource = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    audioSource.connect(analyser);
  }

  function releaseMic() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioSource) { try { audioSource.disconnect(); } catch {} audioSource = null; }
    analyser = null;
  }

  // Stop the recording in progress. With `discard`, its audio is dropped
  // instead of sent, and whoever stopped it decides what happens next.
  function stopActiveRecorder(discard) {
    const recorder = mediaRecorder;
    mediaRecorder = null;
    if (recorder && recorder.state === 'recording') {
      recorder.discard = discard;
      try { recorder.stop(); } catch {}
    }
  }

  function sendAudio(blob, withScreenshot) {
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      console.log(`[Overlay] Sending ${Math.round(blob.size/1024)}KB audio`);

      // ── Screen Vision (borrowed from Clicky) ──
      // Capture desktop screenshot so the AI can SEE what the user sees.
      // Dictated phrases are typed, not reasoned about, so they skip it.
      let screenshot = null;
      if (withScreenshot) {
        try {
          if (window.electronAPI && window.electronAPI.captureScreen) {
            screenshot = await window.electronAPI.captureScreen();
            if (screenshot) console.log(`[Overlay] Screenshot captured (${Math.round(screenshot.length/1024)}KB)`);
          }
        } catch (err) {
          console.warn('[Overlay] Screenshot failed:', err.message);
        }
      }

      ws.send(JSON.stringify({
        type: 'voice_audio',
        source: 'overlay', // the student speaking (the Chat page's mic is not)
        audio: base64,
        mimeType: blob.type || 'audio/webm',
        screenshot, // base64 JPEG or null
      }));
    };
    reader.readAsDataURL(blob);
  }

  async function startListening() {
    if (!active) return;
    if (ttsActive) return; // Don't capture our own TTS output (Gap 3)
    if (state === 'listening' || state === 'processing' || micStarting) return;

    // Enforce cooldown. Dictation skips it: sound right after a phrase is the
    // next phrase, not an echo.
    const cooldownRemaining = COOLDOWN_MS - (Date.now() - lastRecordEnd);
    if (!dictationMode && !taskRunning && cooldownRemaining > 0) {
      setTimeout(() => { if (active) startListening(); }, cooldownRemaining);
      return;
    }

    // Never run two recordings at once.
    stopActiveRecorder(true);

    micStarting = true;
    let recorder = null;
    try {
      await openMic();
      if (!active || ttsActive) { releaseMic(); return; }

      const levels = analyser;
      const chunks = [];
      const startedAt = Date.now();
      let hasSpeechDetected = false;
      let lastSpeechAt = 0;
      let silenceStart = null;
      // Time spent at a quiet voice level: louder than room hum, but below
      // SPEECH_THRESHOLD. Tells "tried to speak but too quietly" apart from
      // ordinary room sound for the HFI-2 "not heard" cue below.
      let quietSoundMs = 0;

      recorder = new MediaRecorder(stream, {
        mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus' : 'audio/webm',
      });
      mediaRecorder = recorder;

      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      let hardStop = null;
      recorder.onstop = () => {
        clearInterval(hardStop);
        if (mediaRecorder === recorder) mediaRecorder = null;
        lastRecordEnd = Date.now();

        // Dictation and running tasks keep the mic open between phrases, so
        // nothing is missed and "stop" always works.
        const keepMicOpen = (dictationMode || taskRunning) && active && !ttsActive && !recorder.discard;
        if (!keepMicOpen && !mediaRecorder && recorder.stream === stream) releaseMic();
        if (recorder.discard) return;

        const blob = new Blob(chunks, { type: recorder.mimeType });
        const heardSpeech = hasSpeechDetected && blob.size > 5000;

        if (heardSpeech && !(ws && ws.readyState === WebSocket.OPEN)) {
          // Socket isn't open — DON'T sit in 'processing' forever. Recover and
          // (re)connect so the next utterance can actually be sent.
          console.warn('[Overlay] WebSocket not open — cannot send command; resetting and reconnecting');
          releaseMic();
          setIdleUI();
          setTranscript(dictationMode ? '✏️ Reconnecting…' : 'Reconnecting…', 'listening-label');
          connectWS();
          setTimeout(() => { if (active) startListening(); }, 800);
          return;
        }

        if (heardSpeech && (dictationMode || taskRunning)) {
          // Send the phrase and go straight back to recording.
          sendAudio(blob, false);
          if (dictationMode) dictationClipsPending++;
          setIdleUI();
          if (keepMicOpen) startListening(); // otherwise TTS 'done' re-opens the mic
          return;
        }

        if (heardSpeech) {
          setProcessingUI();
          setTranscript('Processing...', '');
          sendAudio(blob, true);
          return;
        }

        setIdleUI();
        // Real sound was made but never crossed SPEECH_THRESHOLD — the concrete
        // engineering surface of the product's #1 documented adoption risk:
        // quiet/atypical speech being silently dropped with zero feedback
        // (HFI-2). Not while dictating (the mic never pauses there) or while
        // AbleSpeak itself is talking.
        const triedToSpeak = quietSoundMs >= QUIET_SPEECH_MIN_MS;
        if (triedToSpeak && !dictationMode && !ttsActive
            && Date.now() - lastNotHeardAt > NOT_HEARD_INTERVAL_MS) {
          lastNotHeardAt = Date.now();
          setNotHeardUI();
          return;
        }
        if (keepMicOpen) startListening();
        else setTimeout(() => { if (active) startListening(); }, 300);
      };

      recorder.start(200);
      setListeningUI();

      const maxRecordMs = () => (dictationMode ? DICTATION_MAX_RECORD_MS : MAX_RECORD_MS);
      // Backstop for the level loop below: if Chromium ever pauses it, the
      // recording still ends instead of growing into minutes of audio.
      hardStop = setInterval(() => {
        if (recorder.state === 'recording' && Date.now() - startedAt > maxRecordMs() + 1000) {
          console.warn('[Overlay] Recording ran past its limit — stopping it');
          recorder.stop();
        }
      }, 1000);

      const data = new Uint8Array(levels.frequencyBinCount);
      let lastFrameAt = startedAt;

      function checkSilence() {
        if (state !== 'listening' || recorder !== mediaRecorder || recorder.state !== 'recording') return;
        const now = Date.now();
        const elapsed = now - startedAt;
        const frameMs = Math.min(now - lastFrameAt, 100);
        lastFrameAt = now;
        if (elapsed > maxRecordMs()) { recorder.stop(); return; }
        levels.getByteFrequencyData(data);
        const avg = data.reduce((a, b) => a + b, 0) / data.length;
        if (avg >= SPEECH_THRESHOLD) {
          hasSpeechDetected = true;
          lastSpeechAt = now;
        } else if (avg >= QUIET_SPEECH_THRESHOLD) {
          quietSoundMs += frameMs;
        }
        if (elapsed < MIN_RECORD_MS) { requestAnimationFrame(checkSilence); return; }
        if (avg < SILENCE_THRESHOLD) {
          if (!silenceStart) silenceStart = now;
          // Dictation waits longer, so a breath mid-sentence doesn't split it.
          // Command mode waits SILENCE_DURATION (1.5s) for deliberate pauses.
          const silenceNeeded = hasSpeechDetected ? (dictationMode ? DICTATION_SILENCE_MS : SILENCE_DURATION) : 2000;
          if (now - silenceStart > silenceNeeded) { recorder.stop(); return; }
        } else {
          silenceStart = null;
        }
        // Background noise can keep the level above SILENCE_THRESHOLD forever.
        // In dictation, end the phrase once speech-level sound has stopped.
        if (dictationMode && hasSpeechDetected && now - lastSpeechAt > DICTATION_SPEECH_GAP_MS) {
          recorder.stop();
          return;
        }
        requestAnimationFrame(checkSilence);
      }
      requestAnimationFrame(checkSilence);
    } catch (err) {
      console.error('[Overlay] Mic error:', err);
      if (recorder && mediaRecorder === recorder) mediaRecorder = null;
      releaseMic();
      setIdleUI();
      setTranscript('Mic error: ' + err.message, 'error');
    } finally {
      micStarting = false;
    }
  }

  function stopRecording() {
    // Stop the recording but DON'T deactivate — we want to stay ready
    consecutiveErrors = 0;
    stopActiveRecorder(true);
    releaseMic();
    setIdleUI();
    setTranscript('Ready — say something', '');
  }

  function fullStop() {
    // Fully deactivate — used when user explicitly clicks mic to turn off
    active = false;
    stopRecording();
    setTranscript('Mic off — click to start', '');
  }

  // ════════════════════════════════════════════
  // ── Toggle Logic — Clean On/Off Switch ──
  // ════════════════════════════════════════════

  let active = false; // Master switch
  let recoveryInterval = null; // Global stuck-state recovery

  function toggleListening() {
    if (active) {
      fullStop();  // User explicitly wants to turn off
      if (recoveryInterval) { clearInterval(recoveryInterval); recoveryInterval = null; }
    } else {
      active = true;
      consecutiveErrors = 0;
      startListening();
      // Start global recovery timer — catches ALL stuck states
      if (recoveryInterval) clearInterval(recoveryInterval);
      recoveryInterval = setInterval(() => {
        if (!active) return;
        // If stuck in 'processing' for >20s, force restart
        if (state === 'processing') {
          console.warn('[Recovery] Stuck in processing — forcing restart');
          ttsActive = false;
          setIdleUI();
          startListening();
        }
        // If idle but should be listening (active + continuous), restart
        if (state === 'idle' && continuousMode && !ttsActive) {
          console.warn('[Recovery] Idle but should be listening — restarting');
          startListening();
        }
        // Force-clear ttsActive if it's been true too long
        if (ttsActive) {
          console.warn('[Recovery] Clearing stuck ttsActive flag');
          ttsActive = false;
          if (state !== 'listening') { setIdleUI(); startListening(); }
        }
      }, 15000); // Check every 15 seconds
    }
  }

  function setContinuousMode(on) {
    continuousMode = on;
    localStorage.setItem('ablespeak_continuous', on ? '1' : '0');
    btnLoop.classList.toggle('loop-on', on);
    btnLoop.setAttribute('aria-pressed', on ? 'true' : 'false');
    btnLoop.setAttribute('aria-label', on
      ? 'Continuous listening mode — ON, mic restarts after each command'
      : 'Continuous listening mode — OFF, one command per activation');
    btnLoop.title = on
      ? 'Continuous listening ON — mic restarts after each command (click to turn off)'
      : 'Continuous listening OFF — one command per activation (click to turn on)';
  }

  // ── Button handlers ──
  btnMic.addEventListener('click', () => {
    if (ttsActive) {
      // Stop TTS immediately — user wants to interrupt
      if (window.electronAPI && window.electronAPI.stopTTS) window.electronAPI.stopTTS();
      window.speechSynthesis?.cancel();
      ttsActive = false;
      btnMic.innerHTML = MIC_SVG;
      setTranscript('Stopped', '');
      if (ttsWatchdog) { clearTimeout(ttsWatchdog); ttsWatchdog = null; }
      resumeListening(300);
      return;
    }
    toggleListening();
  });

  btnLoop.addEventListener('click', () => setContinuousMode(!continuousMode));
  setContinuousMode(continuousMode); // apply persisted state to the button UI

  btnDashboard.addEventListener('click', () => {
    window.electronAPI.showDashboard();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      fullStop();
      window.electronAPI.hideOverlay();
    }
  });

  // ── IPC: Global shortcut triggered (legacy toggle path) ──
  window.electronAPI.onToggleListen(() => {
    toggleListening();
  });

  // ── IPC: Overlay shown via shortcut/tray/wake phrase — always start fresh ──
  if (window.electronAPI.onShown) {
    window.electronAPI.onShown(() => {
      // Reset any stale state from a previous session
      clearWatchdog();
      if (state === 'processing') setIdleUI();
      if (!active) {
        active = true;
        consecutiveErrors = 0;
      }
      if (state !== 'listening') startListening();
      // Tell the server we're visible — clears its "dismissed" gate even if
      // shown via the shortcut/tray instead of the wake phrase (HFI-1).
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'overlay_shown' }));
      }
    });
  }

  // ── IPC: Overlay hiding — stop the mic but DON'T deactivate ──
  // In always-listening mode, hiding is temporary (e.g. voice "dismiss")
  if (window.electronAPI.onStop) {
    window.electronAPI.onStop(() => {
      stopActiveRecorder(true);
      releaseMic();
      setIdleUI();
      setTranscript('', '');
    });
  }

  // ── AUTO-START: Make overlay always-listening like dictation tools ──
  // After WebSocket connects, auto-activate the mic so the user never needs
  // a keyboard shortcut. The overlay is always visible and always listening.
  let autoStartDone = false;
  function tryAutoStart() {
    if (autoStartDone) return;
    autoStartDone = true;
    // Small delay to let the UI settle
    setTimeout(() => {
      if (!active && state === 'idle') {
        console.log('[Overlay] Auto-starting continuous listening mode');
        active = true;
        consecutiveErrors = 0;
        startListening();
      }
    }, 1500);
  }
  // Try auto-start when WS connects (fast path) or after a timeout (fallback)
  const origOnOpen = ws ? ws.onopen : null;
  if (ws) {
    const prevOnOpen = ws.onopen;
    ws.onopen = function() {
      if (prevOnOpen) prevOnOpen.apply(this, arguments);
      tryAutoStart();
    };
  }
  setTimeout(tryAutoStart, 4000); // Fallback if WS was already open

  // ── IPC: Show the actually-registered shortcut in the hint ──
  if (window.electronAPI.onShortcut) {
    window.electronAPI.onShortcut(({ shortcut }) => {
      const hint = document.querySelector('.shortcut-hint');
      if (hint && shortcut) {
        hint.innerHTML = 'Dictate <kbd>' + shortcut.replace(/\+/g, ' + ') + '</kbd>';
      }
    });
  }

  // ── IPC: AI Response (fallback when WS not connected) ──
  window.electronAPI.onResponse((data) => {
    handleResponse({
      text: data.text,
      error: data.error,
      silent: data.silent,
      toolCalls: data.toolCalls,
    });
  });

  // ── IPC: Error ──
  window.electronAPI.onError((data) => {
    setTranscript(data.message || 'An error occurred', 'error');
    if (continuousMode && active) {
      setTimeout(() => { setIdleUI(); if (active) startListening(); }, 2000);
    } else {
      setIdleUI();
    }
  });

  // ── IPC: TTS playback state — mute the mic while audio plays (Gap 3) ──
  if (window.electronAPI.onTTSState) {
    window.electronAPI.onTTSState((s) => {
      if (s === 'speaking') {
        ttsActive = true;
        // Turn the mic button into a stop button so the user can interrupt
        btnMic.innerHTML = STOP_SVG;
        btnMic.className = 'btn btn-mic speaking';
        btnMic.setAttribute('aria-label', 'Speaking — click to stop');
        btnMic.title = 'Click to stop speaking';
        // Stop any in-progress recording so we don't capture our own voice.
        // What the student said before this point is still sent.
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          try { mediaRecorder.stop(); } catch {}
        }
      } else if (s === 'done') {
        ttsActive = false;
        // Restore the mic button
        btnMic.innerHTML = MIC_SVG;
        if (ttsWatchdog) { clearTimeout(ttsWatchdog); ttsWatchdog = null; }
        // Cooldown, then re-open the mic (TTS finished speaking)
        if (active) {
          setTimeout(() => {
            if (active && !ttsActive && state !== 'listening') { setIdleUI(); startListening(); }
          }, TTS_COOLDOWN_MS);
        }
      }
    });
  }

  // ── IPC: Configure silence timeout (from settings) ──
  if (window.electronAPI.onConfig) {
    window.electronAPI.onConfig((config) => {
      if (config.silenceTimeout && typeof config.silenceTimeout === 'number') {
        SILENCE_DURATION = Math.max(1000, Math.min(8000, config.silenceTimeout));
        console.log('[Overlay] Silence timeout set to', SILENCE_DURATION, 'ms');
      }
      if (typeof config.continuousMode === 'boolean') {
        setContinuousMode(config.continuousMode);
      }
    });
  }

  // ── Voice control routing ──
  // Interrupt ("stop"/"cancel"), dismiss/restore, and sleep/wake are all owned by
  // the server (ws-proxy) so they never reach the LLM and the mic never actually
  // stops listening — a student with no keyboard/mouse must always have a voice
  // path back. The server replies with voice_cancelled / voice_dismissed /
  // voice_restored / voice_sleeping / voice_awake, which we react to below.
  const INTERRUPT_PHRASES = /^(stop|cancel|abort|shut up|be quiet|quiet)[\s.,!]?/i;
  const _origHandleWSMessage = handleWSMessage;
  handleWSMessage = function(data) {
    // Local fast-path: stop TTS immediately on interrupt words (the server also
    // cancels server-side so the utterance never reaches the LLM). Not while
    // dictating, where "stop" is text to type, as it is on the server.
    if (data.type === 'voice_transcription' && !dictationMode && INTERRUPT_PHRASES.test((data.text || '').trim())) {
      showHeard(data.text);
      if (window.electronAPI.stopTTS) window.electronAPI.stopTTS();
      window.speechSynthesis?.cancel();
      ttsActive = false;
      setTranscript('Stopped', '');
      clearWatchdog();
      // Restart mic so user can give a new command immediately
      resumeListening(300);
      return;
    }

    // Server told us the current operation was cancelled.
    if (data.type === 'voice_cancelled') {
      finishTurn('done', 'Stopped');
      if (window.electronAPI.stopTTS) window.electronAPI.stopTTS();
      ttsActive = false;
      setTranscript('Stopped', '');
      clearWatchdog();
      resumeListening(300);
      return;
    }

    // Server dismissed us (voice "close"/"dismiss"/"hide"/"go away") — hide the
    // overlay but keep the mic hot and listening. Say "AbleSpeak" or "come back"
    // is the ONLY way back for a student with no keyboard or mouse (HFI-1).
    if (data.type === 'voice_dismissed') {
      finishTurn('done', '✓ Hidden — say "come back" to show me');
      stopRecording();
      setTranscript('', '');
      window.electronAPI.hideOverlay();
      clearWatchdog();
      if (data.say) speak(data.say); // 'done' event will re-open the mic
      else resumeListening(300);
      return;
    }

    // Server restored us from dismiss — show the overlay again.
    if (data.type === 'voice_restored') {
      finishTurn('done', '✓ Back');
      window.electronAPI.showOverlay();
      clearWatchdog();
      if (data.say) speak(data.say);
      else resumeListening(300);
      return;
    }

    // Server entered sleep mode — keep the mic on (to hear "wake up") but go quiet.
    if (data.type === 'voice_sleeping') {
      finishTurn('done', '✓ Asleep — say "wake up"');
      sleeping = true;
      clearWatchdog();
      if (data.say) speak(data.say); // 'done' event will re-open the mic
      else resumeListening(300);
      return;
    }

    // Server woke up — resume normal operation.
    if (data.type === 'voice_awake') {
      finishTurn('done', '✓ Awake');
      sleeping = false;
      btnMic.style.opacity = '';
      clearWatchdog();
      if (data.say) speak(data.say);
      else resumeListening(300);
      return;
    }

    // ── Dictation Mode ──
    if (data.type === 'dictation_mode') {
      finishTurn('done', data.enabled ? '✓ Dictation on' : '✓ Dictation off');
      dictationMode = data.enabled;
      dictationClipsPending = 0;
      clearWatchdog();
      if (state === 'listening') {
        // Relabel the recording already running; it finishes in the new mode.
        setListeningUI();
      } else {
        // state may still be 'processing' — must reset before startListening() or it bails
        setIdleUI();
        // Enter dictation mode — green mic, different label
        if (dictationMode) btnMic.className = 'btn btn-mic dictating';
      }
      setTranscript(dictationMode ? '✏️ Dictating...' : 'Command mode', 'listening-label');
      if (data.say) speak(data.say);
      else resumeListening(300);
      return;
    }

    // Dictation text was typed — show brief feedback. The mic is usually
    // already recording the next phrase; if not, restart it.
    // A typing failure must be audible, not just logged server-side — the
    // student is mid-sentence and has no way to proofread a word that never
    // actually got typed (CVA-3).
    if (data.type === 'dictation_typed') {
      dictationClipAnswered();
      clearWatchdog();
      if (data.error) {
        finishTurn('failed', '✗ ' + (data.message || "That didn't type"));
        setTranscript('⚠️ ' + (data.message || "That didn't type"), 'error');
        speak(data.message || "That didn't type. Please try again."); // 'done' event re-opens the mic
        return;
      }
      finishTurn('done', /^\[.*\]$/.test((data.text || '').trim()) ? `✓ ${data.text.trim().slice(1, -1)}` : '✓ Typed');
      setTranscript('✏️ ' + (data.text || '').trim().slice(0, 60), 'listening-label');
      resumeListening(100);
      return;
    }

    _origHandleWSMessage(data);
  };

  // ── Ensure voices are loaded for TTS ──
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

})();
</script>
</body>
</html>
