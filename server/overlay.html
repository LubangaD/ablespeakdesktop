<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbleSpeak Overlay</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  /* ── Container ── */
  .overlay-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    height: 100%;
    padding: 8px;
  }

  /* ── Floating Pill ── */
  .pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: rgba(18, 18, 24, 0.92);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 10px 18px 12px;
    min-width: 200px;
    max-width: 420px;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: bottom center;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .pill.hiding {
    animation: slideDown 0.2s cubic-bezier(0.4, 0, 1, 1) forwards;
  }

  @keyframes slideDown {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(12px) scale(0.96); }
  }

  /* ── Shortcut Hint ── */
  .shortcut-hint {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #a78bfa 0%, #6ee7b7 50%, #93c5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0.9;
  }

  .shortcut-hint kbd {
    font-family: inherit;
    font-weight: 700;
    -webkit-text-fill-color: transparent;
  }

  /* ── Transcript / Status Area ── */
  .transcript-area {
    width: 100%;
    min-height: 0;
    max-height: 80px;
    overflow: hidden;
    text-align: center;
    transition: all 0.2s ease;
  }

  .transcript-area:empty {
    display: none;
  }

  .transcript-text {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .transcript-text.response {
    color: rgba(167, 139, 250, 0.95);
  }

  .transcript-text.error {
    color: rgba(248, 113, 113, 0.9);
    font-size: 12px;
  }

  .transcript-text.listening-label {
    color: rgba(110, 231, 183, 0.9);
    font-size: 12px;
    animation: textPulse 1.5s ease-in-out infinite;
  }

  .transcript-text.interim {
    color: rgba(255, 255, 255, 0.5);
    font-style: italic;
  }

  @keyframes textPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ── Button Row ── */
  .btn-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    position: relative;
    outline: none;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.7);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    transform: scale(1.08);
  }

  .btn:active {
    transform: scale(0.95);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── Mic Button (special) ── */
  .btn-mic {
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.08);
  }

  .btn-mic.listening {
    background: rgba(110, 231, 183, 0.2);
    color: #6ee7b7;
    box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.4);
    animation: micPulse 1.5s ease-in-out infinite;
  }

  @keyframes micPulse {
    0%   { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.35); }
    70%  { box-shadow: 0 0 0 12px rgba(110, 231, 183, 0); }
    100% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0); }
  }

  .btn-mic.processing {
    background: rgba(167, 139, 250, 0.2);
    color: #a78bfa;
    animation: none;
  }

  .btn-mic svg {
    width: 20px;
    height: 20px;
  }

  /* ── Student Picker ── */
  .picker-area {
    display: none;
    width: 100%;
    padding: 6px 0 2px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    margin-top: 4px;
  }

  .picker-area.visible {
    display: block;
  }

  .picker-question {
    font-size: 14px;
    font-weight: 600;
    color: rgba(110, 231, 183, 0.9);
    text-align: center;
    margin-bottom: 6px;
  }

  .picker-names {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }

  .picker-name {
    font-size: 24px; /* WCAG AA+: ≥24px */
    font-weight: 700;
    color: #fff;
    background: rgba(167, 139, 250, 0.18);
    border-radius: 10px;
    padding: 4px 14px;
    line-height: 1.2;
  }

  /* ── Truth-state line: wake-listening / listening / heard / working / done / failed / repair ── */
  .state-line {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-align: center;
    min-height: 0;
  }
  .state-line:empty { display: none; }
  .state-line.wake-listening { color: #60a5fa; }
  .state-line.listening { color: #6ee7b7; }
  .state-line.heard     { color: #ffffff; }
  .state-line.working   { color: #a78bfa; }
  .state-line.done      { color: #6ee7b7; }
  .state-line.failed    { color: #f87171; }
  .state-line.repair    { color: #fbbf24; }

  /* ── Wake-listening dot indicator ── */
  .wake-dot {
    display: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #60a5fa;
    flex-shrink: 0;
    animation: wakePulse 2s ease-in-out infinite;
  }
  .wake-dot.visible { display: inline-block; }

  @keyframes wakePulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* ── Persistent last-transcript readout: Heard: "…" ── */
  .heard-line {
    display: none;
    width: 100%;
    font-size: 20px;   /* readout ≥20px, high contrast */
    font-weight: 600;
    color: #ffffff;
    text-align: center;
    line-height: 1.3;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .heard-line.visible { display: block; }

  /* ── Repair prompt: Did you mean "X"? (matches picker style) ── */
  .repair-area {
    display: none;
    width: 100%;
    padding: 6px 0 2px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    margin-top: 4px;
  }
  .repair-area.visible { display: block; }
  .repair-question {
    font-size: 24px;   /* WCAG AA+: ≥24px */
    font-weight: 700;
    color: #fff;
    background: rgba(251, 191, 36, 0.16);
    border-radius: 10px;
    padding: 6px 14px;
    text-align: center;
    line-height: 1.25;
  }
  .repair-hint {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    margin-top: 4px;
  }

  /* ── Reduced motion: keep the overlay calm for motion-sensitive users ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="overlay-root">
  <div class="pill" id="pill">
    <!-- Shortcut hint -->
    <div class="shortcut-hint">
      Dictate <kbd>Ctrl + Shift + A</kbd>
    </div>

    <!-- Wake-listening indicator (distinct from armed listening) -->
    <div style="display:flex;align-items:center;gap:5px;justify-content:center;">
      <span class="wake-dot" id="wakeDot" aria-hidden="true"></span>
      <!-- Truth state: wake-listening / listening / heard / working / done / failed(reason) / repair -->
      <div class="state-line" id="stateLine" role="status" aria-live="polite"></div>
    </div>

    <!-- Persistent last-transcript readout -->
    <div class="heard-line" id="heardLine" aria-live="polite"></div>

    <!-- Transcript / status text -->
    <div class="transcript-area" id="transcriptArea">
      <div class="transcript-text" id="transcriptText"></div>
    </div>

    <!-- Student Picker (voice-driven, aria-live for screen readers) -->
    <div class="picker-area" id="pickerArea" role="status" aria-live="polite" aria-atomic="true">
      <div class="picker-question" id="pickerQuestion"></div>
      <div class="picker-names" id="pickerNames"></div>
    </div>

    <!-- Repair prompt: "Did you mean X?" — answer by voice (yes / no) -->
    <div class="repair-area" id="repairArea" role="alert" aria-atomic="true">
      <div class="repair-question" id="repairQuestion"></div>
      <div class="repair-hint">Say “yes” or “no”</div>
    </div>

    <!-- Button row -->
    <div class="btn-row">
      <button class="btn btn-mic" id="btnMic" title="Click to speak">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="btn" id="btnText" title="Type a command (coming soon)" style="opacity:0.4;cursor:default;">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn" id="btnDashboard" title="Open Dashboard">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ── DOM refs ──
  const pill = document.getElementById('pill');
  const btnMic = document.getElementById('btnMic');
  const btnDashboard = document.getElementById('btnDashboard');
  const transcriptArea = document.getElementById('transcriptArea');
  const transcriptText = document.getElementById('transcriptText');
  const pickerArea = document.getElementById('pickerArea');
  const pickerQuestion = document.getElementById('pickerQuestion');
  const pickerNames = document.getElementById('pickerNames');
  const stateLine = document.getElementById('stateLine');
  const heardLine = document.getElementById('heardLine');
  const repairArea = document.getElementById('repairArea');
  const repairQuestion = document.getElementById('repairQuestion');
  const wakeDot = document.getElementById('wakeDot');

  // ── State ──
  let state = 'idle'; // idle | wake-listening | listening | processing
  let hasGreeted = false;
  let continuousMode = true; // Auto-restart recording after each command
  let consecutiveErrors = 0; // Stop continuous mode after repeated failures
  const MAX_CONSECUTIVE_ERRORS = 3;

  // ── Wake-word settings (refreshed via settings_update WS message) ──
  let wakeWordEnabled = true;
  let wakeWordPhrases = ['hey able', 'able speak'];

  // ── Backoff calculator (mirrors server/src/reconnect.js — see that file) ──
  function nextRetryDelay(attempt, baseMs, capMs) {
    baseMs = baseMs || 500; capMs = capMs || 15000;
    return Math.min(capMs, baseMs * Math.pow(2, attempt));
  }

  // ── Wake-word matcher (mirrors server/src/speech-tuning.js isWakeWord — see that file) ──
  function normWake(s) {
    return String(s || '').toLowerCase().replace(/[^\w\s]/g, '').trim().replace(/\s+/g, ' ');
  }
  function lev(a, b) {
    if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
    let p = Array.from({length: b.length+1}, (_,i) => i), c = [];
    for (let i = 1; i <= a.length; i++) {
      c[0] = i;
      for (let j = 1; j <= b.length; j++) {
        c[j] = Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1));
      }
      [p, c] = [c, p];
    }
    return p[b.length];
  }
  function isWakeWord(transcript, phrases) {
    const t = normWake(transcript); const tns = t.replace(/\s/g,'');
    for (const phrase of (phrases||[])) {
      const p = normWake(phrase); if (!p) continue;
      const pns = p.replace(/\s/g,'');
      if (t.includes(p) || (pns && tns.includes(pns))) return true;
      const ml = Math.max(t.length, p.length);
      if (ml && lev(t,p)/ml <= 0.35) return true;
      if (pns && tns) { const ml2 = Math.max(tns.length, pns.length); if (ml2 && lev(tns,pns)/ml2 <= 0.35) return true; }
    }
    return false;
  }

  // ── Recording state ──
  let mediaRecorder = null;
  let audioChunks = [];
  let stream = null;
  let audioCtx = null;
  let silenceStart = null;
  const SILENCE_THRESHOLD = 15;
  const SILENCE_DURATION = 1500; // 1.5s silence = speech finished
  const MIN_RECORD_MS = 1000;    // Minimum 1s recording before silence check
  const COOLDOWN_MS = 2000;      // Minimum 2s between recordings (rate limit protection)
  let recordStart = 0;
  let lastRecordEnd = 0;         // When the last recording stopped

  // ── TTS ──
  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.1;
    u.pitch = 1.0;
    u.volume = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.name.includes('Microsoft Zira') || v.name.includes('Google') || v.lang.startsWith('en')
    );
    if (preferred) u.voice = preferred;
    window.speechSynthesis.speak(u);
    return u;
  }

  // ── UI helpers ──
  function setTranscript(text, className) {
    transcriptText.textContent = text;
    transcriptText.className = 'transcript-text' + (className ? ' ' + className : '');
    transcriptArea.style.display = text ? 'block' : 'none';
  }

  // ── Truth states: wake-listening / listening / heard / working / done / failed(reason) / repair ──
  // Every interaction ends in done, failed(<reason>) or repair — never a silent drop.
  function setTruthState(name, detail) {
    const labels = {
      idle: '',
      'wake-listening': 'waiting for wake word',
      listening: 'listening…',
      heard: 'heard',
      working: 'working…',
      done: 'done',
      failed: `failed (${detail || 'error'})`,
      repair: 'repair — answer yes or no',
    };
    stateLine.textContent = labels[name] !== undefined ? labels[name] : name;
    stateLine.className = 'state-line ' + name;
    // Wake dot: only visible in wake-listening state
    if (name === 'wake-listening') {
      wakeDot.classList.add('visible');
    } else {
      wakeDot.classList.remove('visible');
    }
    // Fix 5 (WCAG): aria-label on a role="status" live region suppresses textContent
    // announcements in some AT implementations. The textContent ("waiting for wake word",
    // "listening…", etc.) is the intended announcement — no aria-label needed.
  }

  // Persistent last-transcript readout — stays visible across states
  function setHeard(text) {
    if (!text) return;
    heardLine.textContent = `Heard: "${text}"`;
    heardLine.classList.add('visible');
    setTruthState('heard');
  }

  function showRepair(question) {
    repairQuestion.textContent = question;
    repairArea.classList.add('visible');
    setTruthState('repair');
  }

  function hideRepair() {
    repairArea.classList.remove('visible');
    repairQuestion.textContent = '';
  }

  function setListeningUI() {
    state = 'listening';
    btnMic.className = 'btn btn-mic listening';
    btnMic.title = 'Listening... click to stop';
    setTranscript('Listening...', 'listening-label');
    setTruthState('listening');
  }

  function setProcessingUI() {
    state = 'processing';
    btnMic.className = 'btn btn-mic processing';
    btnMic.title = 'Processing...';
    setTruthState('working');
  }

  function setIdleUI() {
    state = 'idle';
    btnMic.className = 'btn btn-mic';
    btnMic.title = 'Click to speak';
  }

  // ════════════════════════════════════════════════
  // ── WebSocket Connection (same pipeline as dashboard) ──
  // ════════════════════════════════════════════════

  let ws = null;
  let wsConnected = false;
  let wsAttempt = 0;

  function connectWS() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    ws = new WebSocket('ws://localhost:3001/ws/dashboard');

    ws.onopen = () => {
      wsConnected = true;
      wsAttempt = 0;
      console.log('[Overlay] WebSocket connected — using fast dashboard pipeline');
      // After reconnect, restore correct state
      if (state === 'idle' && wakeWordEnabled) {
        startWakeListener();
      }
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        handleWSMessage(data);
      } catch {}
    };

    ws.onclose = () => {
      wsConnected = false;
      // Capped exponential backoff — mirrors reconnect.js nextRetryDelay
      const delay = nextRetryDelay(wsAttempt);
      wsAttempt++;
      console.log(`[Overlay] WS closed, reconnecting in ${delay}ms (attempt ${wsAttempt})`);
      setTimeout(connectWS, delay);
    };

    ws.onerror = () => {
      wsConnected = false;
    };
  }

  function showPicker(question, names) {
    pickerQuestion.textContent = question || "Who's using AbleSpeak?";
    pickerNames.innerHTML = '';
    (names || []).forEach(name => {
      const span = document.createElement('span');
      span.className = 'picker-name';
      span.textContent = name;
      pickerNames.appendChild(span);
    });
    pickerArea.classList.add('visible');
  }

  function hidePicker() {
    pickerArea.classList.remove('visible');
    pickerNames.innerHTML = '';
    pickerQuestion.textContent = '';
  }

  function handleWSMessage(data) {
    // Settings update — live toggle of wake word from Setup wizard
    if (data.type === 'settings_update') {
      if (typeof data.wakeWordEnabled === 'boolean') wakeWordEnabled = data.wakeWordEnabled;
      if (Array.isArray(data.wakeWordPhrases)) wakeWordPhrases = data.wakeWordPhrases;
      if (!wakeWordEnabled) {
        stopWakeListener();
        if (state === 'wake-listening') { state = 'idle'; setTruthState('idle'); }
      } else if (state === 'idle') {
        startWakeListener();
      }
      return;
    }

    // Student picker prompt — show roster names
    if (data.type === 'picker_prompt') {
      showPicker(data.question, data.names);
      return;
    }

    // Picker resolved — hide picker UI
    if (data.type === 'picker_clear') {
      hidePicker();
      return;
    }

    // Repair prompt — "Did you mean X?" (large display + spoken, then listen for yes/no)
    if (data.type === 'repair_prompt') {
      const q = data.question || `Did you mean "${data.candidate}"?`;
      showRepair(q);
      const utterance = speak(q);
      const restart = () => {
        if (continuousMode && active && state !== 'listening') { setIdleUI(); startListening(); }
      };
      if (utterance) {
        utterance.onend = () => setTimeout(restart, 200);
        setTimeout(restart, 5000); // TTS watchdog — never dead-end in repair
      } else {
        setTimeout(restart, 800);
      }
      return;
    }

    // Repair resolved — hide repair UI
    if (data.type === 'repair_clear') {
      hideRepair();
      return;
    }

    // Voice transcription received — persistent "Heard:" readout
    if (data.type === 'voice_transcription') {
      setHeard(data.text || '');
      setTruthState('working');
      return;
    }

    // Rejected input — show WHY (never a silent drop)
    if (data.type === 'voice_no_speech') {
      setTruthState('failed', data.reason || 'no_speech');
      if (continuousMode && active) {
        setTimeout(() => { setIdleUI(); if (active) startListening(); else resumeWake(); }, 800);
      } else {
        setIdleUI(); resumeWake();
      }
      return;
    }

    // Voice error
    if (data.type === 'voice_error') {
      consecutiveErrors++;
      setTranscript(data.error || 'Voice error', 'error');
      setTruthState('failed', data.error || 'voice error');
      if (continuousMode && consecutiveErrors < MAX_CONSECUTIVE_ERRORS) {
        setTimeout(() => { setIdleUI(); if (active) startListening(); }, 1500);
      } else {
        setIdleUI();
      }
      return;
    }

    // Voice busy
    if (data.type === 'voice_busy') {
      setTranscript('Processing...', '');
      return;
    }

    // Command complete (voice or chat) — this is the actual AI response
    if (data.type === 'command_complete') {
      handleResponse(data);
      return;
    }

    // Chat assistant message (alternative response type)
    if (data.type === 'chat_assistant_message') {
      handleResponse(data);
      return;
    }
  }

  function handleResponse(data) {
    // The repair question is rendered + spoken by the repair_prompt handler —
    // skip the duplicate chat broadcast so it isn't spoken twice.
    if (data.provider === 'repair' && typeof data.text === 'string' && data.text.indexOf('Did you mean') === 0) {
      return;
    }

    if (data.error) {
      consecutiveErrors++;
      setTranscript(data.text || data.error || 'Error', 'error');
      setTruthState('failed', typeof data.error === 'string' ? data.error : 'command error');
      if (continuousMode && consecutiveErrors < MAX_CONSECUTIVE_ERRORS) {
        setTimeout(() => { setIdleUI(); if (active) startListening(); else resumeWake(); }, 1500);
      } else {
        setIdleUI(); resumeWake();
      }
      return;
    }

    consecutiveErrors = 0;
    setTruthState('done');

    // Determine if silent (action commands like scroll)
    const isSilent = data.silent === true ||
      (data.toolCalls && Array.isArray(data.toolCalls) && !data.text?.trim());

    if (isSilent) {
      setTranscript('✓', 'response');
      if (continuousMode && active) {
        setTimeout(() => { setIdleUI(); if (active) startListening(); else resumeWake(); }, 300);
      } else {
        setTimeout(() => { setIdleUI(); setTranscript('', ''); resumeWake(); }, 400);
      }
      return;
    }

    // Normal response with text
    const responseText = (typeof data.result === 'string' ? data.result : data.result?.text) || data.text || '';
    if (responseText && responseText !== 'Done') {
      setTranscript(responseText, 'response');
      const utterance = speak(responseText);
      if (utterance && continuousMode && active) {
        utterance.onend = () => {
          setTimeout(() => { setIdleUI(); if (active) startListening(); else resumeWake(); }, 300);
        };
        setTimeout(() => {
          if (state !== 'listening' && active) {
            setIdleUI();
            if (continuousMode) startListening(); else resumeWake();
          }
        }, 6000);
      } else if (continuousMode && active) {
        setTimeout(() => { setIdleUI(); if (active) startListening(); else resumeWake(); }, 2000);
      } else {
        setIdleUI(); resumeWake();
      }
    } else {
      if (continuousMode && active) {
        setTimeout(() => { setIdleUI(); if (active) startListening(); else resumeWake(); }, 300);
      } else {
        setIdleUI(); resumeWake();
      }
    }
  }

  // Resume wake listening after an interaction — only when not armed/active
  function resumeWake() {
    if (!active && wakeWordEnabled && state !== 'wake-listening') {
      setTimeout(startWakeListener, 500);
    }
  }

  // Connect immediately
  connectWS();

  // ════════════════════════════════════════════════
  // ── Wake-word listener loop ──
  // Runs continuous speech recognition in low-key background mode.
  // On match → arm the mic (enter normal listening state).
  // Auto-restarts on onend/onerror with 500ms delay indefinitely,
  // unless wakeWordEnabled=false or armed/processing.
  // ════════════════════════════════════════════════

  let wakeRecognition = null;
  let wakeListenerActive = false;

  function startWakeListener() {
    if (!wakeWordEnabled) return;
    if (wakeListenerActive) return;
    if (active) return; // Don't run while armed/processing — no double sessions
    if (state === 'listening' || state === 'processing') return;
    if (typeof window.webkitSpeechRecognition !== 'function') return;

    wakeListenerActive = true;
    state = 'wake-listening';
    setTruthState('wake-listening');

    try {
      wakeRecognition = new webkitSpeechRecognition();
    } catch (e) {
      wakeListenerActive = false;
      state = 'idle';
      return;
    }

    wakeRecognition.lang = navigator.language || 'en-US';
    wakeRecognition.continuous = true;  // continuous for wake listening
    wakeRecognition.interimResults = false;
    wakeRecognition.maxAlternatives = 1;

    wakeRecognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = (e.results[i][0]?.transcript || '').trim();
        if (!transcript) continue;
        if (isWakeWord(transcript, wakeWordPhrases)) {
          // Wake word detected — arm the mic
          console.log('[Overlay] Wake word detected:', transcript);
          stopWakeListener();
          speak('Listening');
          active = true;
          continuousMode = true;
          consecutiveErrors = 0;
          setTimeout(() => { startListening(); }, 300);
          return;
        }
      }
    };

    wakeRecognition.onend = () => {
      wakeListenerActive = false;
      wakeRecognition = null;
      if (!active && wakeWordEnabled && state !== 'listening' && state !== 'processing') {
        // Auto-restart on session end (sessions terminate ~60s on silence)
        state = 'idle';
        setTimeout(startWakeListener, 500);
      } else if (state === 'wake-listening') {
        state = 'idle';
        setTruthState('idle');
      }
    };

    wakeRecognition.onerror = (e) => {
      if (e.error === 'aborted') return;
      console.warn('[Overlay] Wake recognition error:', e.error);
      wakeListenerActive = false;
      wakeRecognition = null;
      if (!active && wakeWordEnabled) {
        state = 'idle';
        setTimeout(startWakeListener, 500);
      }
    };

    try {
      wakeRecognition.start();
    } catch (e) {
      wakeListenerActive = false;
      wakeRecognition = null;
      state = 'idle';
    }
  }

  function stopWakeListener() {
    wakeListenerActive = false;
    if (wakeRecognition) {
      try { wakeRecognition.abort(); } catch {}
      wakeRecognition = null;
    }
    if (state === 'wake-listening') {
      state = 'idle';
      setTruthState('idle');
    }
  }

  // ── Microphone reconnect on device change ──
  // If a mic is unplugged/replugged, reacquire on the next recording attempt.
  // We don't need to pre-acquire; getUserMedia is called fresh each startBlobRecording.
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', () => {
      console.log('[Overlay] Media device change detected — mic may have changed');
      // If we were mid-recording, the stream will error; stopRecording gracefully
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });
  }

  // ════════════════════════════════════════════════
  // ── Primary ASR: Web Speech API (per-utterance confidence) ──
  // ════════════════════════════════════════════════

  let webSpeechFailed = false;
  let recognition = null;

  function startWebSpeech() {
    try {
      recognition = new webkitSpeechRecognition();
    } catch (err) {
      console.warn('[Overlay] Web Speech unavailable:', err.message);
      webSpeechFailed = true;
      startBlobRecording();
      return;
    }
    recognition.lang = navigator.language || 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 3; // only the TOP alternative's confidence is used

    recognition.onresult = (e) => {
      const top = e.results[0] && e.results[0][0];
      const text = ((top && top.transcript) || '').trim();
      // Missing/zero confidence → null → server treats it as unknown (fuzzy path only)
      const confidence = (top && typeof top.confidence === 'number' && top.confidence > 0) ? top.confidence : null;
      if (!text) { handleNoSpeech(); return; }
      setHeard(text);
      setProcessingUI();
      sendVoiceText(text, confidence);
    };

    recognition.onerror = (e) => {
      if (e.error === 'no-speech') { handleNoSpeech(); return; }
      if (e.error === 'aborted') { return; } // stopRecording() aborts intentionally
      // network / not-allowed / service errors → permanent fallback to audio blobs
      console.warn('[Overlay] Web Speech error:', e.error, '— falling back to audio recording');
      webSpeechFailed = true;
      setIdleUI();
      if (active) startBlobRecording();
    };

    recognition.onend = () => {
      lastRecordEnd = Date.now();
      recognition = null;
      // Ended while still "listening" with no result → treat as no speech
      if (state === 'listening' && !webSpeechFailed) handleNoSpeech();
    };

    recognition.start();
    setListeningUI();
  }

  function handleNoSpeech() {
    // While a repair question is pending, a no-speech result must not clobber
    // the repair UI with a contradictory failed(no_speech) state.  Keep the
    // question visible and restart listening so the student can still answer.
    if (repairArea.classList.contains('visible')) {
      if (continuousMode && active) {
        setTimeout(() => { if (active) startListening(); }, 600);
      }
      return;
    }
    setTruthState('failed', 'no_speech');
    if (continuousMode && active) {
      setIdleUI();
      setTimeout(() => { if (active) startListening(); }, 600);
    } else {
      setIdleUI();
    }
  }

  function sendVoiceText(text, confidence) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'voice_text', text, confidence }));
    } else {
      // IPC fallback when the WebSocket is down
      window.electronAPI.sendText(text, confidence);
    }
  }

  // Router: Web Speech first, audio-blob (Gemini) fallback
  async function startListening() {
    if (!active) return;
    if (state === 'listening' || state === 'processing') return;

    // Enforce cooldown
    const cooldownRemaining = COOLDOWN_MS - (Date.now() - lastRecordEnd);
    if (cooldownRemaining > 0) {
      setTimeout(() => { if (active) startListening(); }, cooldownRemaining);
      return;
    }

    if (!webSpeechFailed && typeof window.webkitSpeechRecognition === 'function') {
      startWebSpeech();
    } else {
      startBlobRecording();
    }
  }

  // ════════════════════════════════════════════════
  // ── Fallback: Voice Recording → Gemini (same approach as dashboard mic) ──
  // ════════════════════════════════════════════════

  async function startBlobRecording() {
    if (!active) return;
    if (state === 'listening' || state === 'processing') return;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
      });

      audioChunks = [];
      let hasSpeechDetected = false;

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus' : 'audio/webm',
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
        lastRecordEnd = Date.now();

        // Minimal client-side sanity gate only — the per-student audio floor
        // (speech profile min_audio_b64) is enforced server-side, so quiet
        // speakers' short recordings still reach transcription.
        if (hasSpeechDetected && blob.size > 1500) {
          setProcessingUI();
          setTranscript('Processing...', '');

          // Send audio over WebSocket — SAME as dashboard (fast!)
          if (ws && ws.readyState === WebSocket.OPEN) {
            const reader = new FileReader();
            reader.onload = () => {
              const base64 = reader.result.split(',')[1];
              console.log(`[Overlay] Sending ${Math.round(blob.size/1024)}KB audio over WebSocket`);
              ws.send(JSON.stringify({
                type: 'voice_audio',
                audio: base64,
                mimeType: blob.type || 'audio/webm',
              }));
            };
            reader.readAsDataURL(blob);
          } else {
            // Fallback to IPC if WS not connected
            console.warn('[Overlay] WebSocket not connected, using IPC fallback');
            const reader = new FileReader();
            reader.onload = () => {
              window.electronAPI.sendAudio(reader.result.split(',')[1], blob.type);
            };
            reader.readAsDataURL(blob);
          }
        } else {
          if (continuousMode && active) {
            setIdleUI();
            setTimeout(() => { if (active) startListening(); }, 300);
          } else {
            setIdleUI();
          }
        }
      };

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      mediaRecorder.start(200);
      recordStart = Date.now();
      setListeningUI();

      silenceStart = null;
      const data = new Uint8Array(analyser.frequencyBinCount);
      const SPEECH_THRESHOLD = 25;
      const MAX_RECORD_MS = 15000;

      function checkSilence() {
        if (state !== 'listening' || !mediaRecorder || mediaRecorder.state !== 'recording') return;
        const elapsed = Date.now() - recordStart;
        if (elapsed > MAX_RECORD_MS) { mediaRecorder.stop(); return; }
        analyser.getByteFrequencyData(data);
        const avg = data.reduce((a, b) => a + b, 0) / data.length;
        if (avg >= SPEECH_THRESHOLD) { hasSpeechDetected = true; silenceStart = null; }
        if (elapsed < MIN_RECORD_MS) { requestAnimationFrame(checkSilence); return; }
        if (avg < SILENCE_THRESHOLD) {
          if (!silenceStart) silenceStart = Date.now();
          const silenceNeeded = hasSpeechDetected ? SILENCE_DURATION : 3000;
          if (Date.now() - silenceStart > silenceNeeded) { mediaRecorder.stop(); return; }
        } else { silenceStart = null; }
        requestAnimationFrame(checkSilence);
      }
      requestAnimationFrame(checkSilence);
    } catch (err) {
      console.error('[Overlay] Mic error:', err);
      setIdleUI();
      setTranscript('Mic error: ' + err.message, 'error');
    }
  }

  function stopRecording() {
    active = false;
    continuousMode = false;
    consecutiveErrors = 0;
    if (recognition) {
      try { recognition.abort(); } catch {}
      recognition = null;
    }
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    hideRepair();
    setIdleUI();
    setTranscript('Ready — click mic to start', '');
    // Resume wake listening now that the student has disarmed
    resumeWake();
  }

  // ════════════════════════════════════════════
  // ── Toggle Logic — Clean On/Off Switch ──
  // ════════════════════════════════════════════

  let active = false; // Master switch

  function toggleListening() {
    if (active) {
      stopRecording();
    } else {
      // Stop wake listener before arming — no double recognition sessions
      stopWakeListener();
      active = true;
      continuousMode = true;
      consecutiveErrors = 0;
      startListening();
    }
  }

  // ── Button handlers ──
  btnMic.addEventListener('click', toggleListening);

  btnDashboard.addEventListener('click', () => {
    window.electronAPI.showDashboard();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      stopRecording();
      window.electronAPI.hideOverlay();
    }
  });

  // ── IPC: Global shortcut triggered ──
  window.electronAPI.onToggleListen(() => {
    toggleListening();
  });

  // ── IPC: Structured server events from /api/voice/text (IPC fallback path) ──
  // Events have the same shape as WS dashboard messages — route through
  // handleWSMessage() so all gate states (repair, picker, voice_no_speech, …)
  // are rendered exactly as they are on the WS path.
  window.electronAPI.onEvent((event) => {
    handleWSMessage(event);
  });

  // ── IPC: AI Response (audio-blob Gemini fallback when WS not connected) ──
  window.electronAPI.onResponse((data) => {
    handleResponse({
      text: data.text,
      error: data.error,
      silent: data.silent,
      toolCalls: data.toolCalls,
    });
  });

  // ── IPC: Error ──
  window.electronAPI.onError((data) => {
    setTranscript(data.message || 'An error occurred', 'error');
    if (continuousMode && active) {
      setTimeout(() => { setIdleUI(); if (active) startListening(); }, 2000);
    } else {
      setIdleUI();
    }
  });

  // ── Ensure voices are loaded for TTS ──
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ── Load persisted settings and start wake listener on boot ──
  fetch('/api/setup/status').then(r => r.json()).then(s => {
    if (typeof s.wakeWordEnabled === 'boolean') wakeWordEnabled = s.wakeWordEnabled;
    if (Array.isArray(s.wakeWordPhrases)) wakeWordPhrases = s.wakeWordPhrases;
  }).catch(() => {}).finally(() => {
    // Start wake listener after settings load (or on error — use defaults)
    if (wakeWordEnabled) {
      setTimeout(startWakeListener, 1500);
    }
  });

})();
</script>
</body>
</html>
